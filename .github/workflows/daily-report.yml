name: Daily Cross-Border AI Report

on:
  schedule:
    # UTC 00:00 = Beijing 08:00 every day
    - cron: '0 0 * * *'
  workflow_dispatch: # manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate report
        run: python generate_report.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet && echo "No changes" || git commit -m "Auto-update: $(date -u '+%Y-%m-%d') cross-border AI report"
          git push
